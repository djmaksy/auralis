name: Build Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Get ASIO SDK (optional — enables ASIO in the app)
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile asio.zip
          Expand-Archive asio.zip -DestinationPath asio
          $dir = (Get-ChildItem asio -Directory | Select-Object -First 1).FullName
          "ASIO_SDK=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        shell: pwsh
        run: |
          $asio = if ($env:ASIO_SDK) { "-DAURALIS_ASIO_SDK=$env:ASIO_SDK" } else { "" }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 $asio

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel --target Auralis_VST3 Auralis_Standalone auralis_core_tests -- /v:minimal /nologo 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report errors 1
        if: failure()
        shell: pwsh
        run: |
          $e = Get-Content build.log | Select-String -Pattern ": (fatal )?error " | ForEach-Object { $_.Line.Replace('D:\a\auralis\auralis\','').Replace('[D:\a\auralis\auralis\build\Auralis.vcxproj]','').Trim() } | Select-Object -Unique
          $e | Out-File errors.txt
          $e | Select-Object -First 10 | ForEach-Object { Write-Output "::error::$_" }
      - name: Report errors 2
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt -ErrorAction SilentlyContinue | Select-Object -Skip 10 -First 10 | ForEach-Object { Write-Output "::error::$_" }
      - name: Report errors 3
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt -ErrorAction SilentlyContinue | Select-Object -Skip 20 -First 10 | ForEach-Object { Write-Output "::error::$_" }
      - name: Report errors 4
        if: failure()
        shell: pwsh
        run: Get-Content errors.txt -ErrorAction SilentlyContinue | Select-Object -Skip 30 -First 10 | ForEach-Object { Write-Output "::error::$_" }

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Auralis_artefacts/Release/Standalone/Auralis.exe dist/
          Copy-Item -Recurse build/Auralis_artefacts/Release/VST3/Auralis.vst3 dist/
          Copy-Item README.md dist/; Copy-Item README.ru.md dist/
          Compress-Archive -Path dist/* -DestinationPath Auralis-Windows-x64.zip
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/Auralis.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Windows-x64
          path: |
            Auralis-Windows-x64.zip
            installer/Output/*.exe

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest Auralis-Windows-x64.zip (Get-ChildItem installer/Output/*.exe).FullName --title "Auralis (latest build)" --notes "Auralis.exe + Auralis.vst3. Setup.exe installs both."
